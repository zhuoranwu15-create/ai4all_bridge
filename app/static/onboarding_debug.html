<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Onboarding Debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #222; font-size: 14px; }

    header { background: #1a1a2e; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge { background: #e74c3c; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; }

    .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 45px); }

    /* LEFT PANEL */
    .sidebar { background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; }

    .section { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
    .section-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

    .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .input-row input { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
    .input-row input:focus { outline: none; border-color: #4a90e2; }

    btn, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-primary { background: #4a90e2; color: #fff; }
    .btn-primary:hover { background: #357abd; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-outline { background: #fff; color: #444; border: 1px solid #ddd; }
    .btn-outline:hover { background: #f5f5f5; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .account-list { overflow-y: auto; flex: 1; }
    .account-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 8px; }
    .account-item:hover { background: #f8f9ff; }
    .account-item.active { background: #ebf3ff; border-left: 3px solid #4a90e2; }
    .account-item .name { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .account-item .meta { font-size: 11px; color: #999; white-space: nowrap; }

    .state-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .state-pending { background: #fff3cd; color: #856404; }
    .state-step1_sent, .state-step2_sent, .state-step3_sent { background: #cfe2ff; color: #084298; }
    .state-complete { background: #d1e7dd; color: #0f5132; }
    .state-timed_out { background: #f8d7da; color: #842029; }

    /* STATE PANEL */
    .state-panel { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
    .state-panel .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .state-panel .label { color: #666; font-size: 12px; }
    .state-panel .value { font-weight: 600; font-size: 13px; }
    .collected-item { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
    .collected-item .key { color: #888; }
    .collected-item .val { color: #333; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .jump-states { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .jump-states button { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid #ddd; background: #fff; cursor: pointer; color: #555; }
    .jump-states button:hover { background: #f0f5ff; border-color: #4a90e2; color: #4a90e2; }

    /* RIGHT PANEL */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    .chat-header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 10px; }
    .chat-header .account-name { font-weight: 600; font-size: 15px; }
    .chat-header .account-id { font-size: 11px; color: #999; font-family: monospace; }

    .chat-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .chat-empty { display: flex; align-items: center; justify-content: center; flex: 1; color: #aaa; font-size: 14px; }

    .msg { max-width: 70%; }
    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    .msg .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: #4a90e2; color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: #fff; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
    .msg .meta { font-size: 11px; color: #aaa; margin-top: 4px; }
    .msg.user .meta { text-align: right; }
    .msg.ai .meta { text-align: left; }

    .msg.system { align-self: center; }
    .msg.system .bubble { background: #f0f0f0; color: #666; font-size: 12px; padding: 6px 12px; border-radius: 10px; }

    .typing-indicator { align-self: flex-start; padding: 10px 14px; background: #fff; border: 1px solid #e0e0e0; border-radius: 14px; border-bottom-left-radius: 4px; }
    .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: #aaa; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    .chat-input-area { padding: 12px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: flex-end; }
    .chat-input-area textarea { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 10px 14px; font-size: 14px; resize: none; font-family: inherit; line-height: 1.4; max-height: 120px; }
    .chat-input-area textarea:focus { outline: none; border-color: #4a90e2; }

    .prompt-preview { padding: 12px 20px; background: #fffde7; border-top: 1px solid #f0e68c; max-height: 160px; overflow-y: auto; }
    .prompt-preview .title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .prompt-preview pre { font-size: 11px; color: #555; white-space: pre-wrap; line-height: 1.5; font-family: monospace; }

    .no-account { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; color: #aaa; }
    .no-account p { font-size: 14px; }

    .sys-prompt-panel { border-top: 1px solid #e0e0e0; background: #fafafa; flex-shrink: 0; }
    .sys-prompt-panel .panel-header { padding: 7px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .sys-prompt-panel .panel-header:hover { background: #f0f0f0; }
    .sys-prompt-panel .panel-title { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .sys-prompt-panel .panel-toggle { font-size: 11px; color: #aaa; }
    .sys-prompt-panel .panel-body { height: 220px; overflow-y: auto; padding: 10px 20px; border-top: 1px solid #eee; }
    .sys-prompt-panel pre { font-size: 11px; color: #444; white-space: pre-wrap; line-height: 1.6; font-family: "SF Mono", "Fira Code", monospace; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 999; display: none; }
    .toast.show { display: block; animation: fadeInOut 3s forwards; }
    @keyframes fadeInOut { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

    select { border: 1px solid #ddd; border-radius: 6px; padding: 5px 8px; font-size: 12px; background: #fff; width: 100%; }
  </style>
</head>
<body>

<header>
  <h1>Onboarding Debug Panel</h1>
  <span class="badge">DEV ONLY</span>
</header>

<div class="layout">
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">

    <!-- Token Config -->
    <div class="section" id="tokenSection">
      <div class="section-title">Token 配置</div>
      <div class="input-row">
        <input type="password" id="inputAdminToken" placeholder="Admin Token" style="font-size:12px;" />
      </div>
      <div class="input-row">
        <input type="password" id="inputBridgeToken" placeholder="Bridge Token" style="font-size:12px;" />
      </div>
      <button class="btn btn-primary btn-sm" style="width:100%" onclick="saveTokens()">保存并刷新</button>
    </div>

    <!-- New Test Session -->
    <div class="section">
      <div class="section-title">新建测试用户</div>
      <div class="input-row">
        <input type="text" id="newSessionId" placeholder="eg. test-alice" />
        <button class="btn btn-primary btn-sm" onclick="createSession()">创建</button>
      </div>
      <div style="font-size:11px;color:#999;">留空则自动生成 ID</div>
    </div>

    <!-- Existing Accounts -->
    <div class="section" style="padding-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="section-title" style="margin:0">已有账号</span>
        <button class="btn btn-outline btn-sm" onclick="loadAccounts()">刷新</button>
      </div>
    </div>
    <div class="account-list" id="accountList">
      <div style="padding:16px;color:#aaa;font-size:13px;text-align:center;">加载中...</div>
    </div>

    <!-- State Panel (shown when account selected) -->
    <div id="statePanel" style="display:none;">
      <div class="state-panel">
        <div class="section-title">Onboarding 状态</div>
        <div class="row" style="margin-bottom:10px;">
          <span id="stateBadge" class="state-badge">-</span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-danger btn-sm" onclick="resetOnboarding()">重置</button>
            <button class="btn btn-outline btn-sm" onclick="refreshState()">刷新</button>
          </div>
        </div>
        <div id="debugFlagRow" style="margin-bottom:8px;display:none;">
          <button class="btn btn-outline btn-sm" style="width:100%;font-size:11px;" onclick="markAsDebug()">⚠ 加入 debug 名单（解除 prompt 脱敏）</button>
        </div>
        <div class="collected-item"><span class="key">用户称呼</span><span class="val" id="collectedUserName">-</span></div>
        <div class="collected-item"><span class="key">AI 名字</span><span class="val" id="collectedAiName">-</span></div>
        <div class="collected-item"><span class="key">Soul 字数</span><span class="val" id="collectedSoul">-</span></div>
        <div style="margin-top:10px;">
          <div class="section-title">跳转步骤</div>
          <div class="jump-states">
            <button onclick="jumpState('pending')">pending</button>
            <button onclick="jumpState('step1_sent')">step1</button>
            <button onclick="jumpState('step2_sent')">step2</button>
            <button onclick="jumpState('step3_sent')">step3</button>
            <button onclick="jumpState('complete')">complete</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT MAIN AREA -->
  <div class="main" id="mainArea">
    <div class="no-account">
      <p>← 选择或创建一个测试账号开始</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let ADMIN_TOKEN = localStorage.getItem('odb_admin_token') || '';
let BRIDGE_TOKEN = localStorage.getItem('odb_bridge_token') || '';

function saveTokens() {
  const a = document.getElementById('inputAdminToken').value.trim();
  const b = document.getElementById('inputBridgeToken').value.trim();
  if (a) { localStorage.setItem('odb_admin_token', a); ADMIN_TOKEN = a; }
  if (b) { localStorage.setItem('odb_bridge_token', b); BRIDGE_TOKEN = b; }
  showToast('Token 已保存，重新加载账号列表');
  loadAccounts();
}

// Pre-fill inputs if tokens already saved
window.addEventListener('DOMContentLoaded', () => {
  if (ADMIN_TOKEN) document.getElementById('inputAdminToken').placeholder = '已设置 ✓';
  if (BRIDGE_TOKEN) document.getElementById('inputBridgeToken').placeholder = '已设置 ✓';
});

let currentAccountId = null;
let messageCounter = 0;

// ─── API helpers ─────────────────────────────────────────────────────────────

function resolveOpsApiPath(path) {
  const inOps = window.location.pathname === '/ops' || window.location.pathname.startsWith('/ops/');
  if (!inOps) return path;
  if (path === '/admin' || path.startsWith('/admin/')) return '/ops' + path;
  if (path === '/debug' || path.startsWith('/debug/')) return '/ops' + path;
  if (path === '/openclaw' || path.startsWith('/openclaw/')) return '/ops' + path;
  return path;
}

async function api(method, path, body) {
  const res = await fetch(resolveOpsApiPath(path), {
    method,
    headers: {
      'Authorization': `Bearer ${ADMIN_TOKEN}`,
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

async function sendTurn(accountId, text) {
  messageCounter++;
  const payload = {
    channel: 'openclaw-weixin',
    channel_account_id: accountId,
    account_id: accountId,
    session_key: `openclaw-weixin:${accountId}:debug-sender-${accountId}`,
    sender_id: `debug-sender-${accountId}`,
    chat_id: `debug-sender-${accountId}`,
    chat_type: 'private',
    message_type: 'text',
    message_id: `debug-${Date.now()}-${messageCounter}`,
    text,
    raw: { event_type: 'message', content: text },
  };
  const res = await fetch(resolveOpsApiPath('/openclaw/turn'), {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${BRIDGE_TOKEN}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

// ─── Account list ─────────────────────────────────────────────────────────────

async function loadAccounts() {
  try {
    const data = await api('GET', '/admin/accounts');
    const list = document.getElementById('accountList');
    const accounts = data.accounts || [];
    if (accounts.length === 0) {
      list.innerHTML = '<div style="padding:16px;color:#aaa;font-size:13px;text-align:center;">暂无账号</div>';
      return;
    }
    list.innerHTML = accounts.map(a => {
      const name = a.display_name || a.id;
      const msgCount = '';
      return `<div class="account-item ${a.id === currentAccountId ? 'active' : ''}" onclick="selectAccount('${a.id}', '${escHtml(name)}')">
        <div>
          <div class="name">${escHtml(name)}</div>
          <div class="meta">${a.id.slice(0, 20)}${a.id.length > 20 ? '…' : ''}</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('accountList').innerHTML = `<div style="padding:16px;color:#e74c3c;font-size:12px;">${e.message}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Create new test session ──────────────────────────────────────────────────

async function createSession() {
  let id = document.getElementById('newSessionId').value.trim();
  if (!id) id = `debug-${Date.now()}`;
  showToast(`正在创建账号 ${id}…`);
  try {
    const res = await api('POST', '/debug/accounts/create', { account_id: id });
    document.getElementById('newSessionId').value = '';
    await loadAccounts();
    await selectAccount(res.account_id, res.account_id);
    showToast(`账号 ${res.account_id} 已创建（onboarding: pending）`);
  } catch (e) {
    showToast(`创建失败: ${e.message}`);
  }
}

// ─── Select account ───────────────────────────────────────────────────────────

async function selectAccount(accountId, displayName) {
  currentAccountId = accountId;

  // Highlight in list
  document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.account-item').forEach(el => {
    if (el.onclick && el.onclick.toString().includes(accountId)) el.classList.add('active');
  });

  // Render main area
  document.getElementById('mainArea').innerHTML = `
    <div class="chat-header">
      <div>
        <div class="account-name">${escHtml(displayName)}</div>
        <div class="account-id">${escHtml(accountId)}</div>
      </div>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="chat-empty" id="chatEmpty">发送消息开始对话</div>
    </div>
    <div class="prompt-preview" id="promptPreview" style="display:none;">
      <div class="title">注入给 LLM 的 Onboarding 提示词</div>
      <pre id="promptPreviewText"></pre>
    </div>
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="2" onkeydown="handleKey(event)"></textarea>
      <button class="btn btn-primary" onclick="sendMessage()">发送</button>
    </div>
    <div class="sys-prompt-panel" id="sysPromptPanel" style="display:none;">
      <div class="panel-header" onclick="toggleSysPrompt()">
        <span class="panel-title">上一条消息 · 组装后的 System Prompt</span>
        <span class="panel-toggle" id="sysPromptToggle">▲ 收起</span>
      </div>
      <div class="panel-body" id="sysPromptBody">
        <pre id="sysPromptText"></pre>
      </div>
    </div>
  `;

  document.getElementById('statePanel').style.display = 'block';
  await refreshState();
}

// ─── State management ─────────────────────────────────────────────────────────

async function refreshState() {
  if (!currentAccountId) return;
  try {
    const data = await api('GET', `/debug/accounts/${currentAccountId}/onboarding`);
    const state = data.onboarding_state;
    const badge = document.getElementById('stateBadge');
    badge.textContent = state;
    badge.className = `state-badge state-${state}`;

    const c = data.collected || {};
    document.getElementById('collectedUserName').textContent = c.user_name || '—';
    document.getElementById('collectedAiName').textContent = c.ai_name || '—';
    document.getElementById('collectedSoul').textContent = c.soul_chars > 0 ? `${c.soul_chars} 字` : '—';

    // Prompt preview
    const preview = document.getElementById('promptPreview');
    const previewText = document.getElementById('promptPreviewText');
    if (data.prompt_context_preview) {
      preview.style.display = 'block';
      previewText.textContent = data.prompt_context_preview;
    } else {
      preview.style.display = 'none';
    }
  } catch (e) {
    showToast(`刷新状态失败: ${e.message}`);
  }
}

async function resetOnboarding() {
  if (!currentAccountId) return;
  if (!confirm(`重置账号 ${currentAccountId} 的 onboarding 状态并清除 SOUL/IDENTITY/USER 文件？`)) return;
  try {
    await api('POST', `/debug/accounts/${currentAccountId}/onboarding/reset`, { clear_context_files: true });
    appendSystemMsg('⟳ Onboarding 已重置到 pending，上下文文件已清除');
    await refreshState();
    showToast('已重置');
  } catch (e) {
    showToast(`重置失败: ${e.message}`);
  }
}

async function jumpState(state) {
  if (!currentAccountId) return;
  try {
    await api('PATCH', `/debug/accounts/${currentAccountId}/onboarding/state`, { state });
    appendSystemMsg(`→ 状态已跳转到 ${state}`);
    await refreshState();
  } catch (e) {
    showToast(`跳转失败: ${e.message}`);
  }
}

// ─── Chat ─────────────────────────────────────────────────────────────────────

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text || !currentAccountId) return;
  input.value = '';
  input.style.height = 'auto';

  appendMsg('user', text);
  const typing = appendTyping();

  try {
    const res = await sendTurn(currentAccountId, text);
    removeTyping(typing);

    const reply = res.reply;
    if (reply) {
      appendMsg('ai', reply, `${res.status}`);
    } else {
      appendMsg('ai', '（无回复）', res.status);
    }

    // Refresh state after each turn
    await refreshState();
    await fetchAndShowSysPrompt();
  } catch (e) {
    removeTyping(typing);
    appendMsg('ai', `❌ 请求失败: ${e.message}`);
  }
}

function appendMsg(role, text, meta) {
  const body = document.getElementById('chatBody');
  const empty = document.getElementById('chatEmpty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="bubble">${escHtml(text)}</div>
    ${meta ? `<div class="meta">${escHtml(meta)}</div>` : ''}
  `;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function appendSystemMsg(text) {
  const body = document.getElementById('chatBody');
  if (!body) return;
  const empty = document.getElementById('chatEmpty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function appendTyping() {
  const body = document.getElementById('chatBody');
  if (!body) return null;
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function removeTyping(el) {
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

// ─── System prompt preview ────────────────────────────────────────────────────

let _sysPromptExpanded = true;

function toggleSysPrompt() {
  _sysPromptExpanded = !_sysPromptExpanded;
  const body = document.getElementById('sysPromptBody');
  const toggle = document.getElementById('sysPromptToggle');
  if (body) body.style.display = _sysPromptExpanded ? 'block' : 'none';
  if (toggle) toggle.textContent = _sysPromptExpanded ? '▲ 收起' : '▼ 展开';
}

async function fetchAndShowSysPrompt() {
  if (!currentAccountId) return;
  try {
    const data = await api('GET', `/debug/accounts/${currentAccountId}/prompt-preview`);
    const panel = document.getElementById('sysPromptPanel');
    const text = document.getElementById('sysPromptText');
    if (!panel || !text) return;
    const flagRow = document.getElementById('debugFlagRow');
    if (data.redacted) {
      text.textContent = `[Prompt 已脱敏，共 ${data.prompt_chars} 字符]\n\n点击左侧"加入 debug 名单"按钮后刷新即可查看。`;
      if (flagRow) flagRow.style.display = 'block';
    } else {
      text.textContent = data.prompt || '(空)';
      if (flagRow) flagRow.style.display = 'none';
    }
    panel.style.display = 'block';
  } catch (_e) {
    // Non-critical; silently skip if admin token missing or endpoint fails
  }
}

async function markAsDebug() {
  if (!currentAccountId) return;
  try {
    await api('POST', `/debug/accounts/${currentAccountId}/mark-debug`);
    showToast(`账号 ${currentAccountId} 已加入 debug 名单`);
    await fetchAndShowSysPrompt();
  } catch (e) {
    showToast(`操作失败: ${e.message}`);
  }
}

// ─── Toast ────────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 3000);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

loadAccounts();
</script>
</body>
</html>
