<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常见问题 - 朝夕相伴</title>
  <link rel="stylesheet" href="site.css">
  <script src="faq-data.js"></script>
</head>
<body>

<nav class="site-nav">
  <a class="brand-logo" href="/ui/home.html">
    <span class="brand-cx">朝夕</span><span class="brand-xb">相伴</span>
  </a>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm" href="/ui/home.html">首页</a>
    <a class="btn btn-ghost btn-sm" href="/user/dashboard.html">用户中心</a>
  </div>
</nav>

<main class="faq-page">
  <section class="faq-hero">
    <h1>常见问题</h1>
  </section>

  <section class="faq-layout">
    <div class="faq-list" id="faq-list"></div>
  </section>
</main>

<footer class="site-footer">
  © 2026 朝夕相伴 · <a href="mailto:support@ai4company.top" style="color:inherit">support@ai4company.top</a>
</footer>

<script>
function escapeHtml(text) {
  return String(text || '').replace(/[&<>"']/g, function(ch) {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch];
  });
}

function renderFaqList() {
  var groups = window.CX_FAQ_GROUPS || [];
  var html = groups.map(function(group) {
    var items = group.items.map(function(item, index) {
      return [
        '<details class="faq-item"' + (index === 0 ? ' open' : '') + '>',
        '<summary>' + escapeHtml(item.question) + '</summary>',
        '<p>' + escapeHtml(item.answer) + '</p>',
        '</details>'
      ].join('');
    }).join('');
    return [
      '<section class="faq-group">',
      '<h2>' + escapeHtml(group.category) + '</h2>',
      items,
      '</section>'
    ].join('');
  }).join('');
  document.getElementById('faq-list').innerHTML = html;
}

renderFaqList();
</script>

</body>
</html>
