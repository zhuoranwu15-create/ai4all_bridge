<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="faq_page_title">常见问题 - 朝夕相伴</title>
  <link rel="stylesheet" href="site.css">
  <script src="product-i18n.js"></script>
  <script src="faq-data.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="brand-group">
    <a class="brand-logo" href="/">
      <span class="brand-cx">朝夕</span><span class="brand-xb">相伴</span>
    </a>
    <span class="beta-badge" data-i18n="beta_label">Beta 测试版</span>
  </div>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm" href="/" data-i18n="nav_home">首页</a>
    <a class="btn btn-ghost btn-sm" href="/user/dashboard.html" data-i18n="nav_dashboard">用户中心</a>
  </div>
</nav>

<main class="faq-page">
  <section class="faq-hero">
    <h1 data-i18n="faq_heading">常见问题</h1>
  </section>

  <section class="faq-layout">
    <div class="faq-list" id="faq-list"></div>
  </section>
</main>

<footer class="site-footer">
  © 2026 朝夕相伴 · <a href="mailto:support@ai4company.top" style="color:inherit">support@ai4company.top</a>
</footer>

<script>
function escapeHtml(text) {
  return String(text || '').replace(/[&<>"']/g, function(ch) {
    return ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch];
  });
}

function renderFaqList(groups) {
  groups = groups || window.CX_FAQ_GROUPS || [];
  var html = groups.map(function(group) {
    var items = group.items.map(function(item, index) {
      return [
        '<details class="faq-item"' + (index === 0 ? ' open' : '') + '>',
        '<summary>' + escapeHtml(item.question) + '</summary>',
        '<p>' + escapeHtml(item.answer) + '</p>',
        '</details>'
      ].join('');
    }).join('');
    return [
      '<section class="faq-group">',
      '<h2>' + escapeHtml(group.category) + '</h2>',
      items,
      '</section>'
    ].join('');
  }).join('');
  document.getElementById('faq-list').innerHTML = html;
}

Promise.all([
  fetch('/api/web/config').then(function(response) { return response.ok ? response.json() : Promise.reject(); }),
  fetch('/api/web/faq/content').then(function(response) { return response.ok ? response.json() : Promise.reject(); }),
]).then(function(results) {
  // 静态资源缺失时不能让整个初始化链中断（否则 FAQ 列表也渲染不出来）。
  if (window.CXProductI18n) {
    window.CXProductI18n.setConfig(results[0]);
    window.CXProductI18n.apply();
  }
  renderFaqList(results[1].groups || []);
}).catch(function() {
  renderFaqList();
});
</script>

</body>
</html>
