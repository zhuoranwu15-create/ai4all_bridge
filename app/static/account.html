<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号详情 – AI4ALL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .context-file { border: 1px solid var(--border, #e2e2e2); border-radius: 6px; margin-bottom: .75rem; overflow: hidden; }
    .context-file-head { display: flex; align-items: baseline; gap: .5rem; padding: .4rem .6rem; background: rgba(0,0,0,.03); }
    .context-file-head strong { font-family: monospace; }
    .context-file-meta { margin-left: auto; font-size: .75rem; opacity: .65; }
    .context-file-content { margin: 0; padding: .6rem; white-space: pre-wrap; word-break: break-word; font-size: .82rem; line-height: 1.5; max-height: 360px; overflow: auto; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← 返回列表</a>
  <span id="admin-user" class="pill">—</span>
  <div id="err" style="display:none" class="status-msg error"></div>
  <div id="content" style="display:none">

    <div class="card">
      <h2>基本信息</h2>
      <div class="form-row"><label>AI4ALL Account ID</label><input id="f-id" class="mono-input" disabled></div>
      <div class="form-row"><label>渠道</label><input id="f-channel" disabled></div>
      <div class="form-row"><label>状态</label><span id="f-status"></span></div>
      <div class="form-row"><label>备注</label><input type="text" id="f-notes" placeholder="运营备注"></div>
      <div class="form-row"><label>显示名称</label><input type="text" id="f-display-name" placeholder="昵称（可选）"></div>
      <div class="form-actions">
        <button class="primary" onclick="saveBasic()">保存</button>
        <span id="st-basic" class="status-msg"></span>
        <button id="btn-toggle" onclick="toggleStatus()" style="margin-left:auto"></button>
      </div>
    </div>

    <div class="card">
      <h2>通道绑定</h2>
      <div id="bindings"></div>
    </div>

    <div class="card">
      <h2>绑定排障链路</h2>
      <div id="binding-trace">加载中…</div>
    </div>

    <div class="card">
      <h2>限流配置</h2>
      <div class="form-row">
        <label>每日上限（空 = 全局默认 100）</label>
        <input type="number" id="f-daily-limit" min="0" placeholder="留空使用全局默认">
      </div>
      <div class="form-row">
        <label>每分钟上限（空 = 全局默认 5）</label>
        <input type="number" id="f-rpm-limit" min="0" placeholder="留空使用全局默认">
      </div>
      <div class="form-actions">
        <button class="primary" onclick="saveLimits()">保存</button>
        <span id="st-limits" class="status-msg"></span>
      </div>
    </div>

    <div class="card">
      <h2>上下文文件（调试）</h2>
      <p class="empty-note" style="margin-top:0">账号组装 LLM prompt 时使用的 SOUL / IDENTITY / USER / MEMORY 文件内容，用于排查人设与记忆问题。</p>
      <div id="context-files">加载中…</div>
    </div>

    <div class="card">
      <h2>今日用量</h2>
      <p id="usage-text">—</p>
    </div>

    <div class="card">
      <h2>权益与贝壳</h2>
      <div id="wallet-panel">加载中…</div>
    </div>

    <div class="card">
      <h2>提醒与主动消息</h2>
      <div id="proactive-panel">加载中…</div>
    </div>

    <div class="card">
      <h2>会话列表</h2>
      <div id="sessions"></div>
    </div>

    <div class="card">
      <h2>最近 Debug Traces</h2>
      <div id="recent-traces">加载中…</div>
    </div>

  </div>

  <script src="admin.js"></script>
  <script>
    var accountId = new URLSearchParams(location.search).get('id');
    if (!accountId) {
      showErr('缺少账号 ID 参数');
    } else {
      loadAll();
    }

    function showErr(msg) {
      var el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = '';
    }

    async function loadAll() {
      try {
        await loadAdminMe();
        var results = await Promise.all([
          apiFetch('/admin/accounts/' + encodeURIComponent(accountId)),
          apiFetch('/admin/accounts/' + encodeURIComponent(accountId) + '/usage'),
          apiFetch('/admin/accounts/' + encodeURIComponent(accountId) + '/wallet').catch(function(e) { return { error: e.message }; }),
          apiFetch('/admin/accounts/' + encodeURIComponent(accountId) + '/proactive-overview').catch(function(e) { return { error: e.message }; }),
          apiFetch('/admin/accounts/' + encodeURIComponent(accountId) + '/context-files').catch(function(e) { return { error: e.message }; }),
        ]);
        var accountData = results[0];
        var usageData = results[1];
        var walletData = results[2];
        var proactiveData = results[3];
        var contextFilesData = results[4];
        fillForm(accountData.account, accountData.profile);
        fillBindings(accountData.channel_bindings || []);
        fillBindingTrace(accountData);
        fillSessions(accountData.sessions);
        fillRecentTraces(accountData.recent_traces || []);
        fillUsage(usageData);
        fillWallet(walletData);
        fillProactiveOverview(proactiveData);
        fillContextFiles(contextFilesData);
        document.getElementById('content').style.display = '';
        document.title = accountId + ' – AI4ALL';
      } catch (e) {
        showErr(e.message);
      }
    }

    function fillBindings(bindings) {
      var el = document.getElementById('bindings');
      if (!bindings.length) {
        el.textContent = '暂无通道绑定';
        return;
      }
      el.innerHTML = bindings.map(function(b) {
        return '<div class="binding-row">'
          + '<div class="binding-grid">'
          + '<div><label>Channel</label><div class="mono">' + esc(b.channel || '') + '</div></div>'
          + '<div><label>Channel Account ID</label><div class="mono">' + esc(b.channel_account_id || '') + '</div></div>'
          + '<div><label>Session Key</label><div class="mono wrap">' + esc(b.session_key || '') + '</div></div>'
          + '<div><label>Sender / Chat</label><div class="mono wrap">' + esc([b.sender_id, b.chat_id].filter(Boolean).join(' / ') || '—') + '</div></div>'
          + '<div><label>Last Seen</label><div>' + esc((b.last_seen_at || '').slice(0, 16) || '—') + '</div></div>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    function fillBindingTrace(data) {
      var el = document.getElementById('binding-trace');
      var user = data.platform_user;
      var owners = data.owner_bindings || [];
      var intents = data.binding_intents || [];
      var bindings = data.channel_bindings || [];
      var activeOwner = owners.find(function(b) { return b.status === 'active'; }) || owners[0];
      var latestIntent = intents[0];
      var latestBinding = bindings[0];

      var rows = [
        {
          label: 'Platform User',
          status: user ? user.status : 'missing',
          main: user ? (user.phone || user.id) : '—',
          meta: user ? ('id: ' + user.id + ' · created: ' + formatDateTime(user.created_at)) : '未找到 owner 绑定对应用户',
        },
        {
          label: 'Owner Binding',
          status: activeOwner ? activeOwner.status : 'missing',
          main: activeOwner ? ('#' + activeOwner.id + ' · ' + activeOwner.binding_method) : '—',
          meta: activeOwner ? ('platform_user: ' + activeOwner.platform_user_id + ' · verified: ' + formatDateTime(activeOwner.verified_at)) : '没有 active owner binding',
        },
        {
          label: 'Binding Intent',
          status: latestIntent ? latestIntent.status : 'missing',
          main: latestIntent ? latestIntent.id : '—',
          meta: latestIntent ? [
            'channel: ' + (latestIntent.channel || '—'),
            'channel_account: ' + (latestIntent.channel_account_id || '—'),
            'expires: ' + formatDateTime(latestIntent.expires_at),
            latestIntent.error ? 'error: ' + latestIntent.error : '',
          ].filter(Boolean).join(' · ') : '没有最近绑定意图',
        },
        {
          label: 'Channel Binding',
          status: latestBinding ? 'active' : 'missing',
          main: latestBinding ? (latestBinding.channel_account_id || latestBinding.session_key || latestBinding.channel) : '—',
          meta: latestBinding ? [
            'session_key: ' + (latestBinding.session_key || '—'),
            'sender/chat: ' + ([latestBinding.sender_id, latestBinding.chat_id].filter(Boolean).join(' / ') || '—'),
            'last_seen: ' + formatDateTime(latestBinding.last_seen_at),
          ].join(' · ') : '没有可用通道绑定',
        },
      ];

      var intentRows = intents.length
        ? '<div class="compact-table"><table><thead><tr><th>Intent</th><th>状态</th><th>通道账号</th><th>过期/完成</th><th>错误</th></tr></thead><tbody>'
          + intents.slice(0, 5).map(function(intent) {
            return '<tr>'
              + '<td class="mono">' + esc(intent.id) + '</td>'
              + '<td>' + statusPill(intent.status) + '</td>'
              + '<td class="mono wrap">' + esc(intent.channel_account_id || '—') + '</td>'
              + '<td>' + esc(formatDateTime(intent.completed_at || intent.expires_at)) + '</td>'
              + '<td class="wrap">' + esc(intent.error || '—') + '</td>'
              + '</tr>';
          }).join('')
          + '</tbody></table></div>'
        : '<div class="empty-note">暂无 binding intent</div>';

      el.innerHTML = '<div class="trace-chain">'
        + rows.map(function(row, i) {
          return '<div class="trace-step">'
            + '<div class="trace-step-head">'
            + '<span class="trace-index">' + (i + 1) + '</span>'
            + '<strong>' + esc(row.label) + '</strong>'
            + statusPill(row.status)
            + '</div>'
            + '<div class="trace-main mono wrap">' + esc(row.main) + '</div>'
            + '<div class="trace-meta wrap">' + esc(row.meta) + '</div>'
            + '</div>';
        }).join('')
        + '</div>'
        + '<h3 class="subhead">最近绑定意图</h3>'
        + intentRows;
    }

    function fillRecentTraces(traces) {
      var el = document.getElementById('recent-traces');
      if (!traces.length) {
        el.innerHTML = '<div class="empty-note">暂无 debug trace。需要在 .env 中配置 DEBUG_TRACE_ACCOUNT_IDS 后才会记录。</div>';
        return;
      }
      el.innerHTML = '<div class="compact-table"><table><thead><tr>'
        + '<th>Trace ID</th><th>Message ID</th><th>Source</th><th>Model</th><th>耗时</th><th>错误</th><th>时间</th><th>操作</th>'
        + '</tr></thead><tbody>'
        + traces.map(function(t) {
          return '<tr>'
            + '<td class="mono wrap">' + esc(t.trace_id || '') + '</td>'
            + '<td class="mono wrap">' + esc(t.message_id || '—') + '</td>'
            + '<td>' + esc(t.source || '—') + '</td>'
            + '<td>' + esc(t.llm_model || '—') + '</td>'
            + '<td>' + esc(t.latency_ms != null ? String(t.latency_ms) + 'ms' : '—') + '</td>'
            + '<td class="wrap">' + esc(t.error || '—') + '</td>'
            + '<td>' + esc(formatDateTime(t.created_at)) + '</td>'
            + '<td><button onclick="viewTrace(\'' + attrJs(t.trace_id || '') + '\')">查看</button></td>'
            + '</tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    function fillForm(account, profile) {
      document.getElementById('f-id').value = account.id;
      document.getElementById('f-channel').value = account.channel || '';
      var statusEl = document.getElementById('f-status');
      statusEl.textContent = account.status;
      statusEl.className = 'status-' + account.status;
      document.getElementById('f-notes').value = account.notes || '';
      document.getElementById('f-display-name').value = account.display_name || '';
      document.getElementById('f-daily-limit').value = account.daily_limit != null ? account.daily_limit : '';
      document.getElementById('f-rpm-limit').value = account.rpm_limit != null ? account.rpm_limit : '';
      var btn = document.getElementById('btn-toggle');
      if (account.status === 'active') {
        btn.textContent = '禁用账号';
        btn.className = 'danger';
      } else {
        btn.textContent = '启用账号';
        btn.className = 'primary';
      }
    }

    function fillUsage(usage) {
      document.getElementById('usage-text').textContent =
        '今日已发 ' + usage.today.message_count + ' 条';
    }

    function fillContextFiles(data) {
      var el = document.getElementById('context-files');
      if (data && data.error) {
        el.innerHTML = '<div class="status-msg error">' + esc(data.error) + '</div>';
        return;
      }
      var files = (data && data.files) || [];
      if (!files.length) {
        el.innerHTML = '<div class="empty-note">暂无上下文文件</div>';
        return;
      }
      el.innerHTML = files.map(function(f) {
        var body;
        if (!f.exists) {
          body = '<div class="empty-note" style="padding:.6rem">文件不存在</div>';
        } else if (!(f.content || '').trim()) {
          body = '<div class="empty-note" style="padding:.6rem">空文件</div>';
        } else {
          body = '<pre class="context-file-content">' + esc(f.content) + '</pre>';
        }
        return '<div class="context-file">'
          + '<div class="context-file-head"><strong>' + esc(f.file) + '</strong>'
          + '<span class="context-file-meta mono">' + (f.chars || 0) + ' 字'
          + (f.exists ? '' : ' · 不存在') + '</span></div>'
          + body
          + '</div>';
      }).join('');
    }

    function fillWallet(data) {
      var el = document.getElementById('wallet-panel');
      if (data && data.error) {
        el.innerHTML = '<div class="status-msg error">' + esc(data.error) + '</div>';
        return;
      }
      if (!data || !data.wallet) {
        el.innerHTML = '<div class="empty-note">暂无 wallet。账号需要 owner binding 后才会生成权益钱包。</div>';
        return;
      }
      var summary = data.wallet;
      var ledger = data.ledger || [];
      el.innerHTML = '<div class="metric-grid compact">'
        + '<div class="metric-tile"><span class="metric-label">余额</span><strong>' + esc(summary.display.balance) + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">单位</span><strong>' + esc(summary.display.unit) + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">Wallet</span><strong class="mono small">' + esc(summary.wallet.id) + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">状态</span><strong>' + esc(summary.wallet.status) + '</strong></div>'
        + '</div>'
        + '<h3 class="subhead">最近流水</h3>'
        + renderLedgerTable(ledger);
    }

    function renderLedgerTable(ledger) {
      if (!ledger.length) return '<div class="empty-note">暂无流水</div>';
      return '<div class="compact-table"><table><thead><tr>'
        + '<th>时间</th><th>类型</th><th>来源</th><th>变动</th><th>余额</th><th>Source ID</th>'
        + '</tr></thead><tbody>'
        + ledger.map(function(item) {
          return '<tr>'
            + '<td>' + esc(formatDateTime(item.created_at)) + '</td>'
            + '<td>' + statusPill(item.entry_type) + '</td>'
            + '<td>' + esc(item.source_type || '—') + '</td>'
            + '<td class="mono">' + esc(item.amount_shells || '—') + '</td>'
            + '<td class="mono">' + esc(item.balance_after_shells || '—') + '</td>'
            + '<td class="mono wrap">' + esc(item.source_id || '—') + '</td>'
            + '</tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    function fillProactiveOverview(data) {
      var el = document.getElementById('proactive-panel');
      if (data && data.error) {
        el.innerHTML = '<div class="status-msg error">' + esc(data.error) + '</div>';
        return;
      }
      data = data || {};
      var state = data.proactive_state;
      var reminders = data.reminders || [];
      var commitments = data.commitments || [];
      var outbound = data.outbound_messages || [];
      el.innerHTML = '<div class="metric-grid compact">'
        + '<div class="metric-tile"><span class="metric-label">Proactive</span><strong>' + esc(state ? (state.enabled ? 'enabled' : 'disabled') : 'none') + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">Next Scan</span><strong class="small">' + esc(state ? formatDateTime(state.next_scan_at) : '—') + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">Reminders</span><strong>' + reminders.length + '</strong></div>'
        + '<div class="metric-tile"><span class="metric-label">Outbound</span><strong>' + outbound.length + '</strong></div>'
        + '</div>'
        + '<h3 class="subhead">Reminders</h3>' + renderTaskTable(reminders, 'reminder')
        + '<h3 class="subhead">Commitments</h3>' + renderTaskTable(commitments, 'commitment')
        + '<h3 class="subhead">Outbound Messages</h3>' + renderOutboundTable(outbound);
    }

    function renderTaskTable(items, kind) {
      if (!items.length) return '<div class="empty-note">暂无 ' + esc(kind) + '</div>';
      return '<div class="compact-table"><table><thead><tr>'
        + '<th>ID</th><th>状态</th><th>Due</th><th>Attempts</th><th>正文</th><th>Outbound</th><th>错误</th>'
        + '</tr></thead><tbody>'
        + items.map(function(item) {
          return '<tr>'
            + '<td class="mono wrap">' + esc(item.id || '—') + '</td>'
            + '<td>' + statusPill(item.status) + '</td>'
            + '<td>' + esc(formatDateTime(item.due_at)) + '</td>'
            + '<td>' + esc(item.attempts != null ? item.attempts : '—') + '</td>'
            + '<td>' + esc(redactedTextLabel(item, 'text')) + '</td>'
            + '<td class="mono">' + esc(item.outbound_message_id || '—') + '</td>'
            + '<td class="wrap">' + esc(item.error || '—') + '</td>'
            + '</tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    function renderOutboundTable(items) {
      if (!items.length) return '<div class="empty-note">暂无 outbound message</div>';
      return '<div class="compact-table"><table><thead><tr>'
        + '<th>ID</th><th>来源</th><th>状态</th><th>发送对象</th><th>Attempts</th><th>正文</th><th>错误</th><th>时间</th>'
        + '</tr></thead><tbody>'
        + items.map(function(item) {
          return '<tr>'
            + '<td class="mono">' + esc(item.id || '—') + '</td>'
            + '<td>' + esc(item.source || '—') + '</td>'
            + '<td>' + statusPill(item.status) + '</td>'
            + '<td class="mono wrap">' + esc(item.to_user_id || item.session_key || '—') + '</td>'
            + '<td>' + esc(item.attempts != null ? item.attempts : '—') + '</td>'
            + '<td>' + esc(redactedTextLabel(item, 'text')) + '</td>'
            + '<td class="wrap">' + esc(item.error || '—') + '</td>'
            + '<td>' + esc(formatDateTime(item.sent_at || item.created_at)) + '</td>'
            + '</tr>';
        }).join('')
        + '</tbody></table></div>';
    }

    function redactedTextLabel(item, field) {
      var chars = item && item[field + '_redacted'] ? item[field + '_chars'] : null;
      return chars != null ? ('已脱敏 · ' + chars + ' 字') : '—';
    }

    function fillSessions(sessions) {
      var el = document.getElementById('sessions');
      if (!sessions || !sessions.length) { el.textContent = '暂无会话'; return; }
      el.innerHTML = sessions.map(function(s) {
        return '<div class="session-row">'
          + '<div class="session-hdr">'
          + '<span style="font-family:monospace;font-size:.8rem">' + esc(s.session_key) + '</span>'
          + '<span>' + (s.message_count || 0) + ' 条'
          + (s.last_message_at ? ' · ' + s.last_message_at.slice(0, 16) : '')
          + ' <button onclick="toggleMsgs(this,' + s.id + ')">展开</button></span>'
          + '</div>'
          + '<div class="session-msgs" id="sm-' + s.id + '"></div>'
          + '</div>';
      }).join('');
    }

    async function toggleMsgs(btn, sessionId) {
      var container = document.getElementById('sm-' + sessionId);
      if (container.classList.contains('open')) {
        container.classList.remove('open');
        btn.textContent = '展开';
        return;
      }
      if (!container.dataset.loaded) {
        btn.textContent = '加载中…';
        try {
          var data = await apiFetch('/admin/sessions/' + sessionId);
          var plaintextDebug = data && data.plaintext_debug;
          var msgs = (data.messages || []).slice(-20);
          container.innerHTML = msgs.length
            ? msgs.map(function(m) {
                var traceBtn = m.trace_id
                  ? '<button onclick="viewTrace(\'' + attrJs(m.trace_id) + '\', event)">Trace</button>'
                  : '';
                var rawBtn = m.id
                  ? '<button onclick="viewRawMetadata(' + m.id + ', event)">Raw</button>'
                  : '';
                var contentClass = plaintextDebug || m.plaintext_debug ? 'msg-content' : 'msg-content redacted';
                return '<div class="msg">'
                  + '<span class="msg-role ' + esc(m.role) + '">' + (m.role === 'user' ? '用户' : 'AI') + '</span>'
                  + '<span class="' + contentClass + '">' + esc(messageContentLabel(m)) + '</span>'
                  + '<span class="msg-meta mono">' + esc(messageMetaLabel(m)) + '</span>'
                  + '<span class="msg-time">' + esc(formatDateTime(m.created_at)) + '</span>'
                  + '<button onclick="requestPlaintext(' + m.id + ', event)">申请</button>'
                  + '<button onclick="viewPlaintext(' + m.id + ', event)">明文</button>'
                  + rawBtn
                  + traceBtn
                  + '</div>';
              }).join('')
            : '<div class="msg"><span class="msg-content">暂无消息</span></div>';
          container.dataset.loaded = '1';
        } catch (e) {
          container.textContent = e.message;
        }
      }
      container.classList.add('open');
      btn.textContent = '收起';
    }

    async function requestPlaintext(messageId, ev) {
      if (ev) ev.stopPropagation();
      var reason = prompt('申请明文访问原因：');
      if (!reason) return;
      try {
        await apiFetch('/admin/plaintext-grants', {
          method: 'POST',
          body: JSON.stringify({
            reason: reason,
            account_scope: [accountId],
            resource_scope: ['message'],
          }),
        });
        alert('已提交明文访问申请');
      } catch (e) {
        alert(e.message);
      }
    }

    function messageContentLabel(m) {
      if (m && (m.plaintext_debug || m.content_redacted === false) && m.content != null) {
        return m.content || '(空内容)';
      }
      if (m && m.content != null && !m.content_redacted) {
        return m.content || '(空内容)';
      }
      return contentLabel(m);
    }

    function messageMetaLabel(m) {
      var parts = [];
      if (m.message_id) parts.push('msg ' + m.message_id);
      if (m.message_type) parts.push(m.message_type);
      if (m.direction) parts.push(m.direction);
      if (m.latency_ms != null) parts.push(m.latency_ms + 'ms');
      if (m.error) parts.push('err ' + m.error);
      if (m.trace_id) parts.push('trace ' + m.trace_id);
      return parts.join(' · ') || '—';
    }

    async function viewRawMetadata(messageId, ev) {
      if (ev) ev.stopPropagation();
      try {
        var data = await apiFetch('/admin/messages/' + messageId + '/raw');
        alert(JSON.stringify(data.message, null, 2));
      } catch (e) {
        alert(e.message);
      }
    }

    async function viewTrace(traceId, ev) {
      if (ev) ev.stopPropagation();
      if (!traceId) return;
      try {
        var data = await apiFetch('/admin/debug/traces/' + encodeURIComponent(traceId));
        alert(JSON.stringify(data.trace, null, 2));
      } catch (e) {
        alert(e.message);
      }
    }

    function statusPill(status) {
      var text = status || 'unknown';
      var cls = 'status-pill status-pill-' + String(text).replace(/[^a-zA-Z0-9_-]/g, '-');
      return '<span class="' + cls + '">' + esc(text) + '</span>';
    }

    function escJs(str) {
      return String(str == null ? '' : str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r');
    }

    function attrJs(str) {
      return esc(escJs(str));
    }

    async function viewPlaintext(messageId, ev) {
      if (ev) ev.stopPropagation();
      var reason = prompt('查看明文原因：', '必要排查');
      if (!reason) return;
      try {
        var data = await apiFetch('/admin/plaintext/messages/' + messageId + '/raw?reason=' + encodeURIComponent(reason));
        alert(data.message.content || '(空内容)');
      } catch (e) {
        alert(e.message);
      }
    }

    async function saveBasic() {
      var st = document.getElementById('st-basic');
      showStatus(st, '保存中…');
      try {
        await apiFetch('/admin/accounts/' + encodeURIComponent(accountId), {
          method: 'PATCH',
          body: JSON.stringify({
            notes: document.getElementById('f-notes').value || null,
            display_name: document.getElementById('f-display-name').value || null,
          }),
        });
        showStatus(st, '已保存 ✓');
      } catch (e) { showStatus(st, e.message, true); }
    }

    async function saveLimits() {
      var st = document.getElementById('st-limits');
      showStatus(st, '保存中…');
      var dv = document.getElementById('f-daily-limit').value;
      var rv = document.getElementById('f-rpm-limit').value;
      try {
        await apiFetch('/admin/accounts/' + encodeURIComponent(accountId), {
          method: 'PATCH',
          body: JSON.stringify({
            daily_limit: dv === '' ? null : parseInt(dv, 10),
            rpm_limit: rv === '' ? null : parseInt(rv, 10),
          }),
        });
        showStatus(st, '已保存 ✓');
      } catch (e) { showStatus(st, e.message, true); }
    }

    async function toggleStatus() {
      var statusEl = document.getElementById('f-status');
      var action = statusEl.textContent === 'active' ? 'disable' : 'enable';
      try {
        await apiFetch('/admin/accounts/' + encodeURIComponent(accountId) + '/' + action, { method: 'POST' });
        loadAll();
      } catch (e) { alert(e.message); }
    }
  </script>
</body>
</html>
