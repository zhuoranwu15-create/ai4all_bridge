<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Provider 管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="index.html">返回后台入口</a>
  <header class="admin-header">
    <div>
      <h1>LLM Provider 管理</h1>
      <p class="page-subtitle">两层模型：family(厂商家族) × tier(pro/flash)。切家族一键把两档设为该家族默认；也可对单档 override 到任意 provider（含跨家族）。</p>
    </div>
    <span id="admin-user" class="pill">—</span>
  </header>

  <div class="card">
    <div class="card-title-row">
      <h2>当前档位</h2>
      <span id="status" class="status-msg"></span>
    </div>
    <div id="active-binding" class="empty-note">加载中…</div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <h2>可选 Provider（family × tier 矩阵）</h2>
      <span class="card-note">密钥只显示是否已配置。</span>
    </div>
    <div class="compact-table">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Family</th>
            <th>Tier</th>
            <th>模型</th>
            <th>协议</th>
            <th>状态</th>
            <th>Base URL</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="providers">
          <tr><td colspan="8">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    var providerState = null;

    (async function init() {
      await loadAdminMe();
      await loadProviders();
    })();

    function providerStatus(provider) {
      var span = document.createElement('span');
      span.className = 'status-pill';
      if (!provider.enabled) {
        span.className += ' status-pill-disabled';
        span.textContent = 'disabled';
      } else if (!provider.configured) {
        span.className += ' status-pill-missing';
        span.textContent = 'missing key';
      } else {
        span.className += ' status-pill-active';
        span.textContent = 'ready';
      }
      return span;
    }

    function tierRow(label, provider, overrideId, tier) {
      var wrap = document.createElement('div');
      wrap.className = 'binding-grid';
      wrap.innerHTML =
          '<div><label>' + esc(label) + ' 档 provider</label><div class="mono">' + esc(provider.id) + '</div></div>'
        + '<div><label>模型</label><div class="mono">' + esc(provider.model) + '</div></div>'
        + '<div><label>协议</label><div class="mono">' + esc(provider.protocol) + '</div></div>'
        + '<div><label>Runtime Override</label><div class="mono">' + esc(overrideId || '—（跟随家族默认）') + '</div></div>';
      var actionWrap = document.createElement('div');
      var clearBtn = document.createElement('button');
      clearBtn.id = 'clear-' + tier + '-override';
      clearBtn.textContent = '恢复家族默认';
      clearBtn.disabled = !overrideId;
      clearBtn.addEventListener('click', function() { clearTierOverride(tier); });
      actionWrap.appendChild(clearBtn);
      wrap.appendChild(actionWrap);
      return wrap;
    }

    function renderActive(data) {
      var el = document.getElementById('active-binding');
      el.textContent = '';
      var head = document.createElement('div');
      head.className = 'binding-grid';
      head.innerHTML =
          '<div><label>Active Family</label><div class="mono">' + esc(data.active_family || '—') + '</div></div>'
        + '<div><label>Settings 默认 Family</label><div class="mono">' + esc(data.settings_default_family || '—') + '</div></div>';
      el.appendChild(head);
      el.appendChild(tierRow('pro', data.pro_provider || {}, data.pro_override_provider_id, 'pro'));
      el.appendChild(tierRow('flash', data.flash_provider || {}, data.flash_override_provider_id, 'flash'));
    }

    function renderProviders(data) {
      providerState = data;
      renderActive(data);
      var tbody = document.getElementById('providers');
      var providers = data.providers || [];
      tbody.textContent = '';
      if (!providers.length) {
        var emptyRow = document.createElement('tr');
        var emptyCell = document.createElement('td');
        emptyCell.colSpan = 8;
        emptyCell.textContent = '暂无 provider';
        emptyRow.appendChild(emptyCell);
        tbody.appendChild(emptyRow);
        return;
      }
      providers.forEach(function(provider) {
        var canUse = provider.enabled && provider.configured;
        var row = document.createElement('tr');

        var idCell = document.createElement('td');
        var idText = document.createElement('strong');
        idText.className = 'mono';
        idText.textContent = provider.id || '';
        var labelText = document.createElement('div');
        labelText.className = 'empty-note';
        var badges = [];
        if (provider.active_family) badges.push('active family');
        if (provider.serves_pro) badges.push('serving pro');
        if (provider.serves_flash) badges.push('serving flash');
        if (provider.pro_override) badges.push('pro override');
        if (provider.flash_override) badges.push('flash override');
        labelText.textContent = (provider.label || '') + (badges.length ? ' · ' + badges.join(' · ') : '');
        idCell.appendChild(idText);
        idCell.appendChild(labelText);
        row.appendChild(idCell);

        ['family', 'tier', 'model', 'protocol'].forEach(function(key) {
          var cell = document.createElement('td');
          cell.className = 'mono';
          cell.textContent = provider[key] || '';
          row.appendChild(cell);
        });

        var statusCell = document.createElement('td');
        statusCell.appendChild(providerStatus(provider));
        var keyEnv = document.createElement('div');
        keyEnv.className = 'empty-note';
        keyEnv.textContent = provider.api_key_env || '—';
        statusCell.appendChild(keyEnv);
        row.appendChild(statusCell);

        var baseUrlCell = document.createElement('td');
        baseUrlCell.className = 'mono wrap';
        baseUrlCell.textContent = provider.base_url || '';
        row.appendChild(baseUrlCell);

        var actionCell = document.createElement('td');
        if (provider.family && !provider.active_family) {
          var famBtn = document.createElement('button');
          famBtn.className = 'primary';
          famBtn.textContent = '设为 active 家族';
          famBtn.addEventListener('click', function() { switchFamily(provider.family); });
          actionCell.appendChild(famBtn);
          actionCell.appendChild(document.createTextNode(' '));
        }
        if (canUse) {
          var proBtn = document.createElement('button');
          proBtn.textContent = '设为 pro';
          proBtn.addEventListener('click', function() { setTierOverride('pro', provider.id); });
          actionCell.appendChild(proBtn);
          actionCell.appendChild(document.createTextNode(' '));
          var flashBtn = document.createElement('button');
          flashBtn.textContent = '设为 flash';
          flashBtn.addEventListener('click', function() { setTierOverride('flash', provider.id); });
          actionCell.appendChild(flashBtn);
          actionCell.appendChild(document.createTextNode(' '));
          var probeButton = document.createElement('button');
          probeButton.textContent = '测试';
          probeButton.addEventListener('click', function() { probeProvider(provider.id); });
          actionCell.appendChild(probeButton);
        }
        row.appendChild(actionCell);
        tbody.appendChild(row);
      });
    }

    async function loadProviders() {
      var status = document.getElementById('status');
      try {
        var data = await apiFetch('/admin/llm/providers');
        renderProviders(data);
        showStatus(status, '已加载', false);
      } catch (e) {
        showStatus(status, e.message, true);
      }
    }

    async function switchFamily(family) {
      var status = document.getElementById('status');
      try {
        await apiFetch('/admin/llm/active-family', {
          method: 'PATCH',
          body: JSON.stringify({ family: family }),
        });
        showStatus(status, '已切换 active 家族到 ' + family, false);
        await loadProviders();
      } catch (e) {
        showStatus(status, e.message, true);
      }
    }

    async function setTierOverride(tier, id) {
      var status = document.getElementById('status');
      try {
        await apiFetch('/admin/llm/tier-override/' + encodeURIComponent(tier), {
          method: 'PATCH',
          body: JSON.stringify({ provider_id: id }),
        });
        showStatus(status, tier + ' 档已 override 到 ' + id, false);
        await loadProviders();
      } catch (e) {
        showStatus(status, e.message, true);
      }
    }

    async function clearTierOverride(tier) {
      var status = document.getElementById('status');
      try {
        await apiFetch('/admin/llm/tier-override/' + encodeURIComponent(tier), { method: 'DELETE' });
        showStatus(status, tier + ' 档已恢复家族默认', false);
        await loadProviders();
      } catch (e) {
        showStatus(status, e.message, true);
      }
    }

    async function probeProvider(id) {
      var status = document.getElementById('status');
      try {
        showStatus(status, '测试中…', false);
        var data = await apiFetch('/admin/llm/providers/' + encodeURIComponent(id) + '/probe', {
          method: 'POST',
          body: JSON.stringify({ message: '你好，测试一下连通性。' }),
        });
        showStatus(status, '测试成功：' + (data.reply || '').slice(0, 80), false);
      } catch (e) {
        showStatus(status, e.message, true);
      }
    }
  </script>
</body>
</html>
