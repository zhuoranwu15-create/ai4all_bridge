<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI4ALL 运营后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>AI4ALL 运营后台</h1>
  <div class="form-actions" style="margin-bottom:16px">
    <a class="button-link primary" href="onboarding.html">Web Onboarding</a>
    <span id="admin-user" class="pill">—</span>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>AI4ALL Account ID</th>
          <th>Channel Account</th>
          <th>状态</th>
          <th>今日 / 日上限</th>
          <th>最近活跃</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6">加载中…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>明文授权申请</h2>
    <div id="grants">加载中…</div>
  </div>

  <div class="card">
    <h2>明文访问记录</h2>
    <div id="access-events">加载中…</div>
  </div>

  <script src="admin.js"></script>
  <script>
    (async function load() {
      await loadAdminMe();
      var tbody = document.getElementById('tbody');
      try {
        var data = await apiFetch('/admin/accounts');
        var accounts = data.accounts;
        if (!accounts.length) {
          tbody.innerHTML = '<tr><td colspan="6">暂无账号</td></tr>';
          return;
        }
        var details = await Promise.all(accounts.map(function(a) {
          var base = '/admin/accounts/' + encodeURIComponent(a.id);
          return Promise.all([
            apiFetch(base + '/usage').catch(function() { return { today: { message_count: '?' } }; }),
            apiFetch(base).catch(function() { return { channel_bindings: [] }; }),
          ]).then(function(items) {
            return { usage: items[0], detail: items[1] };
          });
        }));
        tbody.innerHTML = accounts.map(function(a, i) {
          var count = details[i].usage.today.message_count;
          var bindings = details[i].detail.channel_bindings || [];
          var channelAccount = bindings.length
            ? (bindings[0].channel_account_id || bindings[0].channel || '—')
            : '—';
          var limit = a.daily_limit != null ? a.daily_limit : '默认';
          var lastActive = a.last_active_at ? a.last_active_at.slice(0, 16) : '—';
          var toggleBtn = a.status === 'active'
            ? '<button class="danger" onclick="toggle(\'' + esc(a.id) + '\',\'disable\')">禁用</button>'
            : '<button class="primary" onclick="toggle(\'' + esc(a.id) + '\',\'enable\')">启用</button>';
          return '<tr>'
            + '<td><a class="mono" href="account.html?id=' + encodeURIComponent(a.id) + '">' + esc(a.id) + '</a></td>'
            + '<td class="mono">' + esc(channelAccount) + '</td>'
            + '<td class="status-' + esc(a.status) + '">' + esc(a.status) + '</td>'
            + '<td>' + esc(String(count)) + ' / ' + esc(String(limit)) + '</td>'
            + '<td>' + esc(lastActive) + '</td>'
            + '<td>' + toggleBtn + '</td>'
            + '</tr>';
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" class="status-msg error">' + esc(e.message) + '</td></tr>';
      }
      loadGrants();
      loadAccessEvents();
    })();

    async function toggle(id, action) {
      try {
        await apiFetch('/admin/accounts/' + encodeURIComponent(id) + '/' + action, { method: 'POST' });
        location.reload();
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadGrants() {
      var el = document.getElementById('grants');
      try {
        var data = await apiFetch('/admin/plaintext-grants?limit=20');
        var grants = data.grants || [];
        if (!grants.length) {
          el.textContent = '暂无授权申请';
          return;
        }
        el.innerHTML = '<table><thead><tr>'
          + '<th>ID</th><th>申请人</th><th>状态</th><th>账号范围</th><th>资源范围</th><th>过期</th><th>操作</th>'
          + '</tr></thead><tbody>'
          + grants.map(function(g) {
            var canAct = window.currentAdminUser && window.currentAdminUser.role === 'admin' && (g.status === 'pending' || g.status === 'approved');
            var actions = '';
            if (canAct && g.status === 'pending') {
              actions += '<button class="primary" onclick="approveGrant(' + g.id + ')">批准</button> ';
              actions += '<button onclick="rejectGrant(' + g.id + ')">拒绝</button>';
            }
            if (canAct && g.status === 'approved') {
              actions += '<button class="danger" onclick="revokeGrant(' + g.id + ')">撤销</button>';
            }
            return '<tr>'
              + '<td class="mono">' + esc(g.id) + '</td>'
              + '<td>' + esc(g.requester_admin_user_id || '') + '</td>'
              + '<td>' + esc(g.status || '') + '</td>'
              + '<td class="mono wrap">' + esc((g.account_scope || []).join(', ')) + '</td>'
              + '<td class="mono wrap">' + esc((g.resource_scope || []).join(', ')) + '</td>'
              + '<td>' + esc(formatDateTime(g.expires_at)) + '</td>'
              + '<td>' + actions + '</td>'
              + '</tr>';
          }).join('')
          + '</tbody></table>';
      } catch (e) {
        el.innerHTML = '<div class="status-msg error">' + esc(e.message) + '</div>';
      }
    }

    async function loadAccessEvents() {
      var el = document.getElementById('access-events');
      try {
        var data = await apiFetch('/admin/access-events?plaintext=true&limit=20');
        var events = data.events || [];
        if (!events.length) {
          el.textContent = '暂无明文访问记录';
          return;
        }
        el.innerHTML = '<table><thead><tr>'
          + '<th>时间</th><th>用户</th><th>动作</th><th>资源</th><th>账号</th><th>原因</th>'
          + '</tr></thead><tbody>'
          + events.map(function(e) {
            return '<tr>'
              + '<td>' + esc(formatDateTime(e.created_at)) + '</td>'
              + '<td>' + esc(e.admin_user_id || '') + '</td>'
              + '<td>' + esc(e.action || '') + '</td>'
              + '<td class="mono">' + esc((e.resource_type || '') + ':' + (e.resource_id || '')) + '</td>'
              + '<td class="mono">' + esc(e.account_id || '') + '</td>'
              + '<td>' + esc(e.reason || '') + '</td>'
              + '</tr>';
          }).join('')
          + '</tbody></table>';
      } catch (e) {
        el.innerHTML = '<div class="status-msg error">' + esc(e.message) + '</div>';
      }
    }

    async function approveGrant(id) {
      await apiFetch('/admin/plaintext-grants/' + id + '/approve', { method: 'POST' });
      loadGrants();
    }

    async function rejectGrant(id) {
      await apiFetch('/admin/plaintext-grants/' + id + '/reject', { method: 'POST' });
      loadGrants();
    }

    async function revokeGrant(id) {
      await apiFetch('/admin/plaintext-grants/' + id + '/revoke', { method: 'POST' });
      loadGrants();
    }
  </script>
</body>
</html>
