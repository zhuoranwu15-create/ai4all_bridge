server {
    listen 80;
    listen [::]:80;
    server_name ai4company.top www.ai4company.top;

    location ^~ /.well-known/acme-challenge/ {
        root /home/jack/workspace/homepage_ai4company;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai4company.top www.ai4company.top;

    root /home/jack/workspace/homepage_ai4company;
    index index.html;

    access_log /var/log/nginx/ai4company.access.log main;
    error_log /var/log/nginx/ai4company.error.log warn;

    ssl_certificate /etc/letsencrypt/live/ai4company.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai4company.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        proxy_pass http://127.0.0.1:8180/ui/home.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/dashboard.html {
        proxy_pass http://127.0.0.1:8180/ui/dashboard.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/creator-role-templates.html {
        proxy_pass http://127.0.0.1:8180/ui/creator_role_templates.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /site.css {
        proxy_pass http://127.0.0.1:8180/ui/site.css;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/site.css {
        proxy_pass http://127.0.0.1:8180/ui/site.css;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /brand.png {
        proxy_pass http://127.0.0.1:8180/ui/brand.png;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /faq.html {
        proxy_pass http://127.0.0.1:8180/ui/faq.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /faq-data.js {
        proxy_pass http://127.0.0.1:8180/ui/faq-data.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 产品级 i18n 运行时（2026-08-02 起 home/dashboard/creator-role-templates/faq 共用）。
    # 官网走逐文件白名单代理，漏加会落到下面的 SPA catch-all 返回 200 HTML，
    # 浏览器把 HTML 当 JS 执行后 window.CXProductI18n 缺失，落地页会禁用发送验证码按钮。
    location = /product-i18n.js {
        proxy_pass http://127.0.0.1:8180/ui/product-i18n.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /user/product-i18n.js {
        proxy_pass http://127.0.0.1:8180/ui/product-i18n.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Versioned mobile App API. The backend already exposes the /api/v1 prefix,
    # so this location forwards the original URI without a rewrite.
    location ^~ /api/v1/ {
        # ASR accepts a 10 MiB file; leave room for multipart headers.
        client_max_body_size 12m;
        client_body_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 135s;
        proxy_read_timeout 135s;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    # v1.5 媒体读端点。服务端签发的读 URL 是 origin 相对路径
    # /v1/media/<id>?scope=&exp=&sig=（app/platform/media/access.py 的 path_prefix），
    # 客户端与阿里云图片机审都直接拿 origin 拼；没有这条 location 时它会落到下面的官网
    # SPA catch-all，返回 200 HTML 而不是 404，故障现场极难辨认。
    # 签名三元组即凭据（不读 Authorization），与 /api/v1/media/* 是同一后端路由。
    location ^~ /v1/media/ {
        client_max_body_size 12m;
        client_body_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 135s;
        proxy_read_timeout 135s;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /api/web/ {
        rewrite ^/api/web/(.*)$ /web/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8180/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8180/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /ops {
        return 302 /ops/;
    }

    location = /ops/ {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        proxy_pass http://127.0.0.1:8180/ui/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/ops/(index|ops|account|reminder_debug|onboarding_debug|proactive_debug|web_search_debug|reactivation_candidates|reactivation_history|realtime_inbound|user_meta|prompt_debug|campaign_codes_admin)\.html$ {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        rewrite ^/ops/(.*)$ /ui/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/ops/(style\.css|admin\.js)$ {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        rewrite ^/ops/(.*)$ /ui/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /ops/admin/ {
        rewrite ^/ops/admin/(.*)$ /admin/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /ops/debug/ {
        rewrite ^/ops/debug/(.*)$ /debug/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /ops/openclaw/ {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        rewrite ^/ops/openclaw/(.*)$ /openclaw/$1 break;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /ops/docs {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        proxy_pass http://127.0.0.1:8180/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        sub_filter_once off;
        sub_filter '/openapi.json' '/ops/openapi.json';
    }

    location = /ops/openapi.json {
        auth_basic "AI4ALL Ops";
        auth_basic_user_file /etc/nginx/.ai4all_ops.htpasswd;
        proxy_pass http://127.0.0.1:8180/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(ui|web|admin|debug|openclaw)/ {
        return 404;
    }

    location ~ ^/(health|docs|openapi\.json)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
