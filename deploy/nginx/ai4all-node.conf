# 面向接入节点(aliyun2)的内网 vhost
# 安装到 /etc/nginx/conf.d/ai4all-node.conf
# 独立文件,不修改 ai4company.top.conf / governor-game.conf,对线上用户流量零影响。
server {
    listen 80;
    listen [::]:80;
    server_name aliyun1 172.24.16.141;   # 内网 hosts 别名 + aliyun1 内网 IP

    # 只允许 aliyun2 内网访问这个面向节点的入口
    allow 172.24.18.88;     # aliyun2 内网
    allow 127.0.0.1;
    deny  all;

    # base64 内联图片经 /openclaw/turn 上送,默认 1m 会 413,放宽到 12m
    client_max_body_size 12m;

    # Part 1:健康探针 + 入站转发
    location = /health/live   { proxy_pass http://127.0.0.1:8180/health/live; }
    location = /openclaw/turn { proxy_pass http://127.0.0.1:8180/openclaw/turn; }

    # Part 2:节点面向 API(心跳 / 出站认领&回报 / 登录 push)
    location ^~ /node/        { proxy_pass http://127.0.0.1:8180; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
