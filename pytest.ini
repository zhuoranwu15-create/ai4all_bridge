[pytest]
# marker 体系（P1）：unit/db/integration 由 conftest 按 fixture 依赖自动派生（见
# tests/conftest.py 的 pytest_collection_modifyitems），slow 按 --durations 实测显式标注。
# --strict-markers：拼错或未注册的 marker 直接报错，面向测试规模增长的廉价护栏。
# 不设改变默认收集范围的其它 addopts —— `make test` 仍是全量。
addopts = --strict-markers
markers =
    unit: 纯函数级，不依赖 DB/FastAPI（最快档，本地快速反馈）
    db: 依赖 fresh_db 等 DB fixture（建库+迁移）
    integration: 走 FastAPI TestClient 全栈
    slow: 单测耗时显著（按 --durations 实测标注）
